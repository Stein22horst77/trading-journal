<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANT — Trading Journal</title>
<script src="/vendor/chart.umd.js"></script>
<style>
  :root {
    --bg: #050505; --panel: #0d0d0d; --panel2: #111214; --line: #232527;
    --ink: #e6e8e6; --muted: #7b807c; --faint: #4a4e4b;
    --gain: #3ddc84; --loss: #ff5d5d; --gain-dim: rgba(61,220,132,.12); --loss-dim: rgba(255,93,93,.12);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; display: flex; }
  aside { width: 232px; min-width: 232px; background: #080808; border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; }
  .brand { font-weight: 700; letter-spacing: .18em; font-size: 13px; padding: 2px 8px 14px; }
  .nav-item { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--muted); font: inherit; padding: 7px 10px; border-radius: 6px; cursor: pointer; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item:hover { color: var(--ink); }
  .nav-item.active { background: var(--ink); color: #0a0a0a; font-weight: 600; }
  .nav-item.soon { color: var(--faint); cursor: default; }
  .nav-item.soon:hover { color: var(--faint); }
  .nav-head { font-size: 10px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; padding: 14px 10px 4px; }
  .nav-sub { padding-left: 20px; font-size: 12px; }
  .acct-item { font-size: 12px; }
  main { flex: 1; min-width: 0; padding: 18px 22px 60px; }
  .ftabs { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 14px; }
  .ftabs button { background: none; border: 0; color: var(--ink); font: inherit; padding: 10px 20px; cursor: pointer; }
  .ftabs button span { color: var(--muted); margin-right: 8px; }
  .ftabs button + button { border-left: 1px solid var(--line); }
  .filters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 10px; }
  @media (max-width: 1100px) { .filters { grid-template-columns: repeat(3, 1fr); } }
  select, input, textarea, button { font: inherit; color: var(--ink); }
  .filters select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
  .count-line { color: var(--muted); font-size: 11px; margin: 6px 0 16px; }
  h1.viewtitle { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
  .viewdesc { color: var(--muted); font-size: 12px; margin-bottom: 16px; max-width: 1100px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 14px 16px; }
  .grid { display: grid; gap: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .kpi { background: var(--panel); padding: 12px 14px; display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 76px; }
  .kpi .label { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .kpi .big { font-size: 17px; font-weight: 700; }
  .kpi .small { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .kpi canvas { max-width: 74px; max-height: 44px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
  .scard { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 13px 15px; border-left: 3px solid var(--faint); }
  .scard.g { border-left-color: var(--gain); } .scard.r { border-left-color: var(--loss); }
  .scard .k { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .scard .v { font-size: 18px; font-weight: 700; }
  .scard .s { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .gain { color: var(--gain); } .loss { color: var(--loss); } .flat { color: var(--ink); }
  .dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .dash-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 1000px) { .dash-grid, .dash-grid2 { grid-template-columns: 1fr; } }
  .panel h2 { font-size: 12px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .tabs button { background: none; border: 0; color: var(--muted); padding: 4px 10px; cursor: pointer; font-size: 11px; }
  .tabs button.on { background: var(--ink); color: #0a0a0a; font-weight: 600; }
  .stat-rows div { display: flex; justify-content: space-between; align-items: center; padding: 7px 2px; border-bottom: 1px solid #191b19; font-size: 12px; }
  .stat-rows div:last-child { border-bottom: 0; }
  .stat-rows .k { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th.sortable { cursor: pointer; } th.sortable:hover { color: var(--ink); }
  td { padding: 9px; border-bottom: 1px solid #17181a; vertical-align: middle; white-space: nowrap; }
  td.num, th.num { text-align: right; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 10px; color: var(--muted); }
  .badge { font-size: 10px; padding: 2px 9px; border-radius: 4px; font-weight: 600; }
  .badge.long { background: var(--gain-dim); color: var(--gain); }
  .badge.short { background: var(--loss-dim); color: var(--loss); }
  .open-badge { color: var(--ink); border: 1px dashed var(--faint); border-radius: 4px; padding: 1px 6px; font-size: 10px; }
  .rowbtn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 5px; }
  .rowbtn:hover { color: var(--ink); }
  .star { color: var(--faint); } .star.on { color: #ffd75e; }
  .tiltbar { display: inline-block; width: 62px; height: 12px; background: #191b19; border-radius: 3px; position: relative; vertical-align: middle; overflow: hidden; }
  .tiltbar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--faint); }
  .tiltbar i { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; }
  form.trade { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; align-items: end; }
  form.trade label, .lbl { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  form.trade input, form.trade select, form.trade textarea, .ctl { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; color-scheme: dark; }
  .full { grid-column: 1 / -1; }
  .btn { background: var(--ink); color: #0a0a0a; border: 0; border-radius: 7px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
  .btn:hover { opacity: .9; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 1px solid var(--gain); outline-offset: 1px; }
  .cal-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .cal-nav { display: flex; align-items: center; gap: 10px; margin-left: auto; margin-right: auto; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .cal-grid.wide { grid-template-columns: repeat(4, 1fr); }
  .cal-dowbar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 7px; }
  .cal-dow { color: var(--muted); font-size: 11px; text-align: center; padding: 7px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
  .cal-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 84px; padding: 8px 10px; font-size: 11px; cursor: pointer; position: relative; }
  .cal-cell.out { opacity: .35; }
  .cal-cell.sel { outline: 1px solid var(--ink); }
  .cal-cell .d { color: var(--muted); font-size: 10px; position: absolute; top: 7px; right: 9px; }
  .cal-cell .p { font-weight: 700; margin-top: 18px; font-size: 13px; }
  .cal-cell .n { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .cal-cell.win { background: rgba(61,220,132,.07); border-color: rgba(61,220,132,.4); }
  .cal-cell.lose { background: rgba(255,93,93,.07); border-color: rgba(255,93,93,.4); }
  .book { display: grid; grid-template-columns: 290px 1fr; gap: 14px; }
  @media (max-width: 900px) { .book { grid-template-columns: 1fr; } }
  .book-list { max-height: 72vh; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
  .book-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .book-card:hover, .book-card.sel { border-color: var(--muted); }
  .book-card .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .book-card .k { color: var(--muted); font-size: 11px; }
  .book-img { width: 100%; border-radius: 7px; border: 1px solid var(--line); }
  .book-empty { border: 1px dashed var(--faint); border-radius: 7px; color: var(--muted); text-align: center; padding: 40px 10px; font-size: 12px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #0a0a0a; padding: 9px 15px; border-radius: 7px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; font-weight: 600; }
  .toast.show { opacity: 1; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 36px 0; }
  #pwBar { display: none; gap: 8px; margin-bottom: 14px; }
  #pwBar input { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; }
  .display-row { display: flex; gap: 26px; margin-bottom: 14px; flex-wrap: wrap; align-items: flex-end; }
  .display-row select, .display-row input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .legend { font-size: 11px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  .legend b { font-weight: 600; color: var(--ink); }
  .edit-panel { max-width: 360px; }
  .edit-panel .field { margin-bottom: 14px; }
  .edit-panel input[type=number] { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; text-align: right; }
  .switch { position: relative; width: 44px; height: 24px; background: #202422; border-radius: 99px; cursor: pointer; border: 1px solid var(--line); }
  .switch.on { background: var(--gain-dim); border-color: var(--gain); }
  .switch i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: left .15s; }
  .switch.on i { left: 22px; background: var(--gain); }
</style>
</head>
<body>

<aside>
  <div class="brand">QUANT</div>
  <div>
    <button class="nav-item active" data-view="dashboard">Dashboard</button>
    <button class="nav-item" data-view="trades">Trades</button>
    <button class="nav-item" data-view="equity">Equity Graph</button>
    <button class="nav-item" data-view="calendar">Calendar</button>
    <button class="nav-item" data-view="fullscan">Full Scan</button>
    <div class="nav-head">Chart Lab</div>
    <button class="nav-item nav-sub" data-view="streaks">Consecutive Winners/L…</button>
    <button class="nav-item nav-sub" data-view="eqexp">Equity vs Expectancy</button>
    <button class="nav-item nav-sub" data-view="fees">Exchange Fee Breakdown</button>
    <button class="nav-item nav-sub" data-view="exitan">Exit Analysis</button>
    <button class="nav-item nav-sub" data-view="kelly">Kelly Criterion</button>
    <button class="nav-item nav-sub" data-view="conc">P&amp;L Concentration</button>
    <button class="nav-item nav-sub" data-view="distribution">P&amp;L Distribution</button>
    <button class="nav-item nav-sub" data-view="bytime">Performance by Time</button>

    <button class="nav-item nav-sub" data-view="stopdist">Stop Distance vs Winr…</button>
    <button class="nav-item nav-sub" data-view="efficiency">Trade Efficiency</button>

  </div>
</aside>

<main>
  <div id="pwBar"><input type="password" id="pwInput" placeholder="Journal password"><button class="btn" id="pwBtn">Unlock</button></div>

  <div id="filterWrap">
    <div class="ftabs">
      <button id="basicBtn"><span id="basicChev">⌄</span>Basic Filters</button>
      <button id="advBtn"><span id="advChev">›</span>Advanced Filters</button>
    </div>
    <div id="basicFilters">
      <div class="filters">
        <select id="fAccount"><option value="">All accounts</option></select>
        <select id="fSymbol"><option value="">All symbols</option></select>
        <select id="fSetup"><option value="">Setup</option></select>
        <select id="fDirection"><option value="">Direction</option><option value="long">Long</option><option value="short">Short</option></select>
        <select id="fOutcome"><option value="">Outcome</option><option value="win">Winners</option><option value="loss">Losers</option><option value="be">Breakeven</option></select>
      </div>
      <div class="filters">
        <select id="fStatus"><option value="">All trades</option><option value="closed">Closed only</option><option value="open">Open only</option></select>
        <select id="fYear"><option value="">Year</option></select>
        <select id="fMonth"><option value="">Month</option></select>
        <select id="fDay"><option value="">Day</option></select>
        <select id="fHour"><option value="">Hour</option></select>
      </div>
    </div>
    <div id="advFilters" style="display:none">
      <div class="filters">
        <select id="fReturn"><option value="">Return %</option><option value="gt0">Positive</option><option value="gte1">≥ +1%</option><option value="gte5">≥ +5%</option><option value="lt0">Negative</option><option value="lte-1">≤ −1%</option><option value="lte-5">≤ −5%</option></select>
        <select id="fR"><option value="">R-Multiple</option><option value="gt2">&gt; 2R</option><option value="1to2">1R – 2R</option><option value="0to1">0R – 1R</option><option value="-1to0">−1R – 0R</option><option value="lt-1">&lt; −1R</option></select>
        <select id="fStarred"><option value="">Starred</option><option value="yes">Starred only</option></select>
        <select id="fLast"><option value="">Last trades</option><option>10</option><option>20</option><option>50</option><option>100</option></select>
        <span></span>
      </div>
    </div>
    <div class="count-line" id="countLine"></div>
  </div>

  <div id="view"></div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ================= state & helpers ================= */
const $ = s => document.querySelector(s);
let all = [];
let view = "dashboard";
let pnlTab = "pnl";
let calPeriod = "daily", calGroupBy = "close", calSel = null;
let calAnchor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let eqUnit = "$", eqTilt = true;
let bookSel = null;
let sortKey = "exit", sortDir = -1;
let showForm = false;
let rollWin = 20;
let btDate = "entry", btPeriod = "weekday";
let stopEdges = "0.5, 1, 2, 5";
let evIn = null, simIn = null, simRuns = null;
const charts = {};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const PALETTE = ["#4b9eff","#f59e0b","#3ddc84","#ff5d5d","#e879f9","#22d3ee","#a3e635","#fb923c","#c084fc"];

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const smoney = n => (n >= 0 ? "+" : "-") + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kfmt = n => { const a = Math.abs(n), sign = n >= 0 ? "+" : "-";
  if (a >= 1e6) return sign + "$" + (a/1e6).toFixed(1) + "M";
  if (a >= 1e4) return sign + "$" + Math.round(a/1e3) + "K";
  if (a >= 1e3) return sign + "$" + (a/1e3).toFixed(1) + "K";
  return sign + "$" + Math.round(a); };
const cls = n => n > 0 ? "gain" : n < 0 ? "loss" : "flat";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const dt = s => { if (!s) return ""; const d = new Date(s); return `${String(d.getDate()).padStart(2,"0")}/${MONTHS[d.getMonth()]}/${String(d.getFullYear()).slice(2)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const dtFull = s => { if (!s) return ""; const d = new Date(s); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const dayKey = d => { d = new Date(d); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2400); }
function chart(id, cfg) { charts[id]?.destroy(); const el = document.getElementById(id); if (el) charts[id] = new Chart(el, cfg); }
function destroyCharts() { for (const k in charts) { charts[k]?.destroy(); delete charts[k]; } }
function normCdf(x) { const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989423 * Math.exp(-x * x / 2);
  let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return x > 0 ? 1 - p : p; }

function pwHeader() { const pw = sessionStorage.getItem("journal_pw"); return pw ? { "x-app-password": pw } : {}; }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...pwHeader(), ...(opts.headers || {}) } });
  if (r.status === 401) { $("#pwBar").style.display = "flex"; throw new Error("Enter the journal password"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
$("#pwBtn").addEventListener("click", () => { sessionStorage.setItem("journal_pw", $("#pwInput").value); $("#pwBar").style.display = "none"; load(); });
$("#pwInput").addEventListener("keydown", e => { if (e.key === "Enter") $("#pwBtn").click(); });

const retPct = t => { const base = Number(t.entry_price) * Number(t.quantity); return t.pnl != null && base ? t.pnl / base * 100 : null; };

/* Tiltmeter: EMA (span 10) of per-trade results in R (fallback pnl / avg|pnl|). */
function computeTilt(closedSorted) {
  const absAvg = closedSorted.length ? closedSorted.reduce((s, t) => s + Math.abs(t.pnl), 0) / closedSorted.length : 1;
  const alpha = 2 / 11;
  let ema = null;
  const map = new Map();
  closedSorted.forEach((t, i) => {
    const r = t.r != null ? t.r : (absAvg ? t.pnl / absAvg : 0);
    ema = ema == null ? r : alpha * r + (1 - alpha) * ema;
    map.set(t.id, i < 3 ? null : ema);
  });
  return map;
}

/* ================= filtering & stats ================= */
function filtered() {
  let t = [...all];
  const v = id => $(id).value;
  if (v("#fAccount")) t = t.filter(x => x.account === v("#fAccount"));
  if (v("#fSymbol")) t = t.filter(x => x.symbol === v("#fSymbol"));
  if (v("#fSetup")) t = t.filter(x => x.setup === v("#fSetup"));
  if (v("#fDirection")) t = t.filter(x => x.direction === v("#fDirection"));
  if (v("#fOutcome") === "win") t = t.filter(x => x.pnl != null && x.pnl > 0);
  if (v("#fOutcome") === "loss") t = t.filter(x => x.pnl != null && x.pnl < 0);
  if (v("#fOutcome") === "be") t = t.filter(x => x.pnl === 0);
  if (v("#fStatus") === "closed") t = t.filter(x => x.pnl != null);
  if (v("#fStatus") === "open") t = t.filter(x => x.pnl == null);
  if (v("#fYear")) t = t.filter(x => new Date(x.entry_date).getFullYear() === +v("#fYear"));
  if (v("#fMonth")) t = t.filter(x => new Date(x.entry_date).getMonth() === +v("#fMonth"));
  if (v("#fDay")) t = t.filter(x => (new Date(x.entry_date).getDay() + 6) % 7 === +v("#fDay"));
  if (v("#fHour")) t = t.filter(x => new Date(x.entry_date).getHours() === +v("#fHour"));
  if (v("#fStarred") === "yes") t = t.filter(x => x.starred);
  const fr = v("#fReturn");
  if (fr) t = t.filter(x => { const p = retPct(x); if (p == null) return false;
    return fr === "gt0" ? p > 0 : fr === "gte1" ? p >= 1 : fr === "gte5" ? p >= 5 :
           fr === "lt0" ? p < 0 : fr === "lte-1" ? p <= -1 : p <= -5; });
  const rr = v("#fR");
  if (rr) t = t.filter(x => { if (x.r == null) return false;
    return rr === "gt2" ? x.r > 2 : rr === "1to2" ? x.r >= 1 && x.r <= 2 : rr === "0to1" ? x.r >= 0 && x.r < 1 :
           rr === "-1to0" ? x.r >= -1 && x.r < 0 : x.r < -1; });
  if (v("#fLast")) t = t.slice(0, +v("#fLast"));
  return t;
}

function computeStats(trades) {
  const closed = trades.filter(t => t.pnl != null)
    .sort((a, b) => new Date(a.exit_date) - new Date(b.exit_date));
  const wins = closed.filter(t => t.pnl > 0), losses = closed.filter(t => t.pnl < 0), be = closed.filter(t => t.pnl === 0);
  const sum = a => a.reduce((s, t) => s + t.pnl, 0);
  const net = sum(closed);
  let cum = 0, peak = 0, maxDD = 0;
  const equity = closed.map(t => { cum += t.pnl; peak = Math.max(peak, cum); maxDD = Math.max(maxDD, peak - cum); return { t, value: cum, dd: cum - peak }; });
  let ws = 0, ls = 0, maxWS = 0, maxLS = 0;
  for (const t of closed) { if (t.pnl > 0) { ws++; ls = 0; } else if (t.pnl < 0) { ls++; ws = 0; } maxWS = Math.max(maxWS, ws); maxLS = Math.max(maxLS, ls); }
  const mean = closed.length ? net / closed.length : 0;
  const std = closed.length ? Math.sqrt(closed.reduce((s, t) => s + (t.pnl - mean) ** 2, 0) / closed.length) : 0;
  const holds = closed.filter(t => t.exit_date).map(t => new Date(t.exit_date) - new Date(t.entry_date));
  const withR = closed.filter(t => t.r != null);
  const decided = wins.length + losses.length;
  return {
    closed, wins, losses, be, net,
    winrate: closed.length ? wins.length / closed.length : 0,
    winrateDecided: decided ? wins.length / decided : 0,
    avgWin: wins.length ? sum(wins) / wins.length : 0,
    avgLoss: losses.length ? sum(losses) / losses.length : 0,
    profitFactor: sum(losses) !== 0 ? Math.abs(sum(wins) / sum(losses)) : null,
    expectancy: mean, std, maxDD, equity, maxWS, maxLS,
    avgHold: holds.length ? holds.reduce((a, b) => a + b, 0) / holds.length : null,
    avgR: withR.length ? withR.reduce((s, t) => s + t.r, 0) / withR.length : null,
    largestWin: wins.length ? Math.max(...wins.map(t => t.pnl)) : 0,
    largestLoss: losses.length ? Math.min(...losses.map(t => t.pnl)) : 0,
    volume: closed.reduce((s, t) => s + Number(t.entry_price) * Number(t.quantity), 0),
    openCount: trades.filter(t => t.pnl == null).length,
    tilt: computeTilt(closed),
  };
}
const fmtHold = ms => { if (ms == null) return "—"; const h = ms / 3.6e6; if (h < 1) return Math.round(ms / 6e4) + "m"; if (h < 48) return h.toFixed(1) + "h"; return (h / 24).toFixed(1) + "d"; };

const unitVal = t => eqUnit === "$" ? t.pnl : eqUnit === "%" ? (retPct(t) ?? 0) : (t.r ?? 0);
const unitFmt = v => eqUnit === "$" ? smoney(v) : (v >= 0 ? "+" : "") + v.toFixed(2) + (eqUnit === "%" ? "%" : "R");

const unitCards = s => {
  const vals = s.closed.map(unitVal);
  const tot = vals.reduce((a, b) => a + b, 0);

};

/* ---- calendar ---- */
function periodKeyAndLabel(d) {
  d = new Date(d);
  if (calPeriod === "daily") return { k: dayKey(d), label: null };
  if (calPeriod === "weekly") { const t = new Date(d); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return { k: "W" + dayKey(t), label: "Wk " + `${String(t.getDate()).padStart(2,"0")} ${MONTHS[t.getMonth()]}` }; }
  if (calPeriod === "monthly") return { k: `M${d.getFullYear()}-${d.getMonth()}`, label: `${MONTHS[d.getMonth()]} ${d.getFullYear()}` };
  return { k: `Q${d.getFullYear()}-${Math.floor(d.getMonth() / 3)}`, label: `Q${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}` };
}
function calDateOf(t) { return calGroupBy === "open" ? t.entry_date : (t.exit_date || t.entry_date); }
VIEWS.calendar = function (t) {
  const closed = t.filter(x => x.pnl != null);
  const map = {};
  for (const x of closed) { const { k } = periodKeyAndLabel(calDateOf(x)); (map[k] ??= { pnl: 0, n: 0, trades: [] }); map[k].pnl += x.pnl; map[k].n++; map[k].trades.push(x); }
  const y = calAnchor.getFullYear(), m = calAnchor.getMonth();
  let bodyHtml = "", navLabel = "";
  const cell = (k, title, dnum, extraCls = "") => {
    const v = map[k];
    return `<div class="cal-cell ${extraCls} ${v ? (v.pnl >= 0 ? "win" : "lose") : ""} ${calSel === k ? "sel" : ""}" data-k="${k}">
      ${dnum != null ? `<div class="d">${dnum}</div>` : ""}
      ${title ? `<div class="muted" style="font-size:10px">${title}</div>` : ""}
      <div class="p ${v ? cls(v.pnl) : "muted"}">${v ? kfmt(v.pnl) : "–"}</div>
      <div class="n">${v ? v.n + " trade" + (v.n > 1 ? "s" : "") : "No trades"}</div></div>`;
  };
  if (calPeriod === "daily") {
    navLabel = `${MONTHS[m]} ${y}`;
    const first = new Date(y, m, 1), startPad = (first.getDay() + 6) % 7;
    const daysIn = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    let cells = "";
    for (let i = startPad - 1; i >= 0; i--) cells += cell(dayKey(new Date(y, m - 1, prevDays - i)), null, prevDays - i, "out");
    for (let d = 1; d <= daysIn; d++) cells += cell(dayKey(new Date(y, m, d)), null, d);
    const total = 7 - ((startPad + daysIn) % 7 || 7);
    for (let d = 1; d <= total; d++) cells += cell(dayKey(new Date(y, m + 1, d)), null, d, "out");
    bodyHtml = `<div class="cal-dowbar">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join("")}</div><div class="cal-grid">${cells}</div>`;
  } else if (calPeriod === "weekly") {
    navLabel = `${MONTHS[m]} ${y}`;
    let mon = new Date(y, m, 1); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    let cells = "";
    for (let i = 0; i < 8; i++) { const { k, label } = periodKeyAndLabel(mon); cells += cell(k, label, null); mon = new Date(mon); mon.setDate(mon.getDate() + 7); }
    bodyHtml = `<div class="cal-grid wide">${cells}</div>`;
  } else if (calPeriod === "monthly") {
    navLabel = `${y}`;
    bodyHtml = `<div class="cal-grid wide">${MONTHS.map((mm, i) => cell(`M${y}-${i}`, `${mm} ${y}`, null)).join("")}</div>`;
  } else {
    navLabel = `${y}`;
    bodyHtml = `<div class="cal-grid wide">${[0,1,2,3].map(q => cell(`Q${y}-${q}`, `Q${q + 1} ${y}`, null)).join("")}</div>`;
  }
  const inScope = calPeriod === "daily" || calPeriod === "weekly"
    ? closed.filter(x => { const d = new Date(calDateOf(x)); return d.getFullYear() === y && d.getMonth() === m; })
    : closed.filter(x => new Date(calDateOf(x)).getFullYear() === y);
  const monthTotal = inScope.reduce((s, x) => s + x.pnl, 0);
  $("#view").innerHTML = `
    <h1 class="viewtitle">Calendar</h1>
    <div class="viewdesc">Your PNL on a calendar — every square is a day, week, month or quarter. Click a square to pull out its equity curve and trades.</div>
    <div class="panel">
      <div class="cal-toolbar">
        <span class="tabs">${["daily","weekly","monthly","quarterly"].map(p => `<button data-p="${p}" class="${calPeriod === p ? "on" : ""}">${p[0].toUpperCase() + p.slice(1)}</button>`).join("")}</span>
        <div class="cal-nav">
          <button class="btn ghost" id="calPrev">‹</button><strong>${navLabel}</strong><button class="btn ghost" id="calNext">›</button>
        </div>
        <div><span class="lbl" style="display:inline;margin-right:8px">Group by</span>
          <select class="ctl" style="width:auto" id="calGroup"><option value="close" ${calGroupBy === "close" ? "selected" : ""}>Close date</option><option value="open" ${calGroupBy === "open" ? "selected" : ""}>Open date</option></select>
          <span class="muted" style="margin-left:14px">Total: <span class="${cls(monthTotal)}">${smoney(monthTotal)}</span></span></div>
      </div>
      ${bodyHtml}
      <div id="calDetail" style="margin-top:14px"></div>
    </div>`;
  document.querySelectorAll(".tabs button[data-p]").forEach(b => b.addEventListener("click", () => { calPeriod = b.dataset.p; calSel = null; render(); }));
  const step = calPeriod === "monthly" || calPeriod === "quarterly" ? 12 : 1;
  $("#calPrev").addEventListener("click", () => { calAnchor = new Date(y, m - step, 1); calSel = null; render(); });
  $("#calNext").addEventListener("click", () => { calAnchor = new Date(y, m + step, 1); calSel = null; render(); });
  $("#calGroup").addEventListener("change", e => { calGroupBy = e.target.value; calSel = null; render(); });
  document.querySelectorAll(".cal-cell[data-k]").forEach(c => c.addEventListener("click", () => { calSel = calSel === c.dataset.k ? null : c.dataset.k; render(); }));
  if (calSel && map[calSel]) renderCalDetail(map[calSel]);
};

/* ---- consecutive winners/losers ---- */
VIEWS.streaks = function (t, s) {
  const streaks = [];
  let cur = null;
  for (const x of s.closed) {
    const sign = x.pnl > 0 ? 1 : x.pnl < 0 ? -1 : 0;
    if (!sign) { cur = null; continue; }
    if (cur && cur.sign === sign) { cur.len++; cur.total += unitVal(x); }
    else { cur = { sign, len: 1, total: unitVal(x) }; streaks.push(cur); }
  }
  const multi = streaks.filter(x => x.len >= 2);
  const buckets = ["2","3","4","5","6","7","8","9","10","> 10"];
  const bIdx = len => len > 10 ? 9 : len - 2;
  const winAvg = buckets.map(() => ({ s: 0, n: 0 })), lossAvg = buckets.map(() => ({ s: 0, n: 0 }));
  for (const x of multi) { const b = x.sign > 0 ? winAvg[bIdx(x.len)] : lossAvg[bIdx(x.len)]; b.s += x.total; b.n++; }
  $("#view").innerHTML = `
    <h1 class="viewtitle">Consecutive Winners/Losers</h1>
    <div class="viewdesc">What a hot hand — or a cold one — actually does to the account: for each streak length, the average run of wins against the average run of losses.</div>
    <div class="count-line">${multi.length} streaks of 2+ trades in view</div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px">
        ${unitSel("stUnit")}
        <div class="legend" style="align-self:flex-end"><span><span class="gain">●</span> Consecutive winners</span><span><span class="loss">●</span> Consecutive losers</span></div>
      </div>
      <canvas id="stChart" height="120"></canvas>
    </div>`;
  bindUnit("stUnit");
  chart("stChart", { type: "bar",
    data: { labels: buckets, datasets: [
      { data: winAvg.map(b => b.n ? b.s / b.n : 0), backgroundColor: css("--gain"), borderRadius: 3, stack: "s" },
      { data: lossAvg.map(b => b.n ? b.s / b.n : 0), backgroundColor: css("--loss"), borderRadius: 3, stack: "s" },
    ] },
    options: { ...noLegend, animation: false,
      plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => (c.datasetIndex === 0 ? "Avg win run: " : "Avg loss run: ") + unitFmt(c.parsed.y) } } },
      scales: { y: { grid: { color: "#141615" }, ticks: eqUnit === "$" ? kTicks : {}, title: { display: true, text: `Average Return (${eqUnit})` } },
        x: { grid: { display: false }, title: { display: true, text: "Consecutive winners/losers" } } } } });
};

/* ---- equity vs expectancy ---- */
VIEWS.eqexp = function (t, s) {
  $("#view").innerHTML = `
    <h1 class="viewtitle">Equity vs Expectancy</h1>
    <div class="viewdesc">Your realised equity path against the straight line your average trade predicts. The band is what variance alone allows — a curve living above it is beating its own edge, one below it is bleeding more than luck explains.</div>
    <div class="display-row">${unitSel("exUnit")}</div>
    <div class="panel">
      <div class="legend" style="justify-content:flex-end;margin-bottom:6px"><span style="color:#4b9eff">—</span> Actual equity <span style="color:#f59e0b">- -</span> Expectancy (${unitFmt(s.closed.length ? s.closed.map(unitVal).reduce((a,b)=>a+b,0)/s.closed.length : 0)}/trade) <span>▒ ±1σ variance</span></div>
      <canvas id="exChart" height="120"></canvas>
    </div>
    ${unitCards(s)}`;
  bindUnit("exUnit");
  if (!s.closed.length) return;
  const vals = s.closed.map(unitVal);
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
  let cum = 0;
  const actual = vals.map(v => (cum += v));
  const exp = vals.map((_, i) => mean * (i + 1));
  const hi = vals.map((_, i) => mean * (i + 1) + sd * Math.sqrt(i + 1));
  const lo = vals.map((_, i) => mean * (i + 1) - sd * Math.sqrt(i + 1));
  chart("exChart", { type: "line",
    data: { labels: vals.map((_, i) => i + 1), datasets: [
      { data: hi, borderWidth: 0, pointRadius: 0, fill: "+1", backgroundColor: "rgba(160,170,160,.10)" },
      { data: lo, borderWidth: 0, pointRadius: 0, fill: false },
      { data: exp, borderColor: "#f59e0b", borderDash: [5, 4], borderWidth: 1.4, pointRadius: 0 },
      { data: actual, borderColor: "#4b9eff", borderWidth: 1.7, pointRadius: 0, tension: .1 },
    ] },
    options: { ...noLegend, animation: false, interaction: { intersect: false, mode: "index" },
      plugins: { ...noLegend.plugins, tooltip: { filter: c => c.datasetIndex >= 2, callbacks: { label: c => (c.datasetIndex === 3 ? "Actual: " : "Expectancy: ") + unitFmt(c.parsed.y) } } },
      scales: { y: { grid: { color: "#141615" }, ticks: eqUnit === "$" ? kTicks : {} }, x: { grid: { display: false }, ticks: { maxTicksLimit: 12 }, title: { display: true, text: "Trade #" } } } } });
};

const VENUES = [["Bybit", 5.5, "#f59e0b"], ["Binance", 5, "#3ddc84"], ["Hyperliquid", 4.5, "#fb923c"], ["Coinbase", 6, "#e879f9"], ["OKX", 5, "#22d3ee"], ["Extended", 2.5, "#c084fc"]];

  $("#view").innerHTML = `

      <canvas id="feeChart" height="110"></canvas>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>Fee breakdown</h2>

    </div>`;
  if (!s.closed.length) return;
  const notionals = s.closed.map(x => Number(x.entry_price) * Number(x.quantity) + (x.exit_price != null ? Number(x.exit_price) * Number(x.quantity) : 0));
  let cum = 0;
  const current = s.closed.map(x => (cum += x.pnl));
  const series = VENUES.map(([name, bps, color]) => {

      scales: { y: { grid: { color: "#141615" }, ticks: kTicks }, x: { grid: { display: false }, ticks: { maxTicksLimit: 12 } } } } });
  $("#feeRows").innerHTML = [
    `<tr><td><span style="color:#4b9eff">—</span> Current</td><td class="num">—</td><td class="num">—</td><td class="num">${money(s.net)}</td><td class="num">—</td></tr>`,
    ...series.map(v => `<tr><td><span style="color:${v.color}">—</span> ${v.name}</td>
      <td class="num">${v.bps}bps (${(v.bps / 100).toFixed(3)}%)</td>

      <td class="num">${money(v.final)}</td>
      <td class="num loss">${smoney(v.final - s.net)}</td></tr>`),
  ].join("");
};

/* ---- exit analysis ---- */
const hasBracket = x => x.pnl != null && [x.take_profit, x.stop_loss, x.max_price, x.min_price].every(v => v != null);
VIEWS.exitan = function (t, s) {
  const withB = s.closed.filter(hasBracket);
  let body;
  if (!withB.length) {
    body = `<div class="viewdesc">No trade in this range has all four of take profit, stop loss, max price and min price recorded. Add them on the Trades page to chart it.</div>`;
  } else {
    body = `<div class="panel">
      <div class="legend" style="margin-bottom:8px"><span><span class="gain">●</span> Run in your favour (MFE %)</span><span><span class="loss">●</span> Run against you (MAE %)</span><span style="color:#f59e0b">- -</span> avg planned TP <span style="color:#e879f9">- -</span> avg planned SL</div>
      <canvas id="exitChart" height="120"></canvas></div>
      <div class="cards" id="exitCards"></div>`;
  }
  $("#view").innerHTML = `
    <h1 class="viewtitle">Exit Analysis</h1>
    <div class="viewdesc">How far each trade ran in your favour and against you, against the bracket you planned. ${withB.length} of ${s.closed.length} trades have the take profit, stop loss, max price and min price needed to chart.</div>
    ${body}`;
  if (!withB.length) return;
  const dirSign = x => x.direction === "short" ? -1 : 1;
  const mfe = withB.map(x => dirSign(x) * (Number(x.max_price) - Number(x.entry_price)) / Number(x.entry_price) * 100 * (x.direction === "short" ? -1 : 1));
  const mfeV = withB.map(x => { const e = Number(x.entry_price);
    return (x.direction === "long" ? (Number(x.max_price) - e) : (e - Number(x.min_price))) / e * 100; });
  const maeV = withB.map(x => { const e = Number(x.entry_price);
    return -((x.direction === "long" ? (e - Number(x.min_price)) : (Number(x.max_price) - e)) / e * 100); });
  const tpAvg = withB.reduce((a, x) => a + Math.abs(Number(x.take_profit) - Number(x.entry_price)) / Number(x.entry_price) * 100, 0) / withB.length;
  const slAvg = -withB.reduce((a, x) => a + Math.abs(Number(x.entry_price) - Number(x.stop_loss)) / Number(x.entry_price) * 100, 0) / withB.length;
  const hitTp = withB.filter(x => { const e = Number(x.entry_price);
    return x.direction === "long" ? Number(x.max_price) >= Number(x.take_profit) : Number(x.min_price) <= Number(x.take_profit); }).length;
  const hitSl = withB.filter(x => x.direction === "long" ? Number(x.min_price) <= Number(x.stop_loss) : Number(x.max_price) >= Number(x.stop_loss)).length;
  chart("exitChart", { type: "bar",
    data: { labels: withB.map((_, i) => i + 1), datasets: [
      { data: mfeV, backgroundColor: "rgba(61,220,132,.6)", borderRadius: 2 },
      { data: maeV, backgroundColor: "rgba(255,93,93,.6)", borderRadius: 2 },
      { type: "line", data: withB.map(() => tpAvg), borderColor: "#f59e0b", borderDash: [5, 4], borderWidth: 1.2, pointRadius: 0 },
      { type: "line", data: withB.map(() => slAvg), borderColor: "#e879f9", borderDash: [5, 4], borderWidth: 1.2, pointRadius: 0 },
    ] },
    options: { ...noLegend, animation: false, interaction: { intersect: false, mode: "index" },
      plugins: { ...noLegend.plugins, tooltip: { filter: c => c.datasetIndex < 2, callbacks: {
        title: i => { const x = withB[i[0].dataIndex]; return `${x.symbol} · ${dt(x.exit_date)}`; },
        label: c => (c.datasetIndex === 0 ? "MFE: +" : "MAE: ") + c.parsed.y.toFixed(2) + "%" } } },
      scales: { y: { grid: { color: "#141615" }, title: { display: true, text: "% from entry" } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 14 }, title: { display: true, text: "Trades" } } } } });
  $("#exitCards").innerHTML =
    scard("Hit planned take profit", `${hitTp} / ${withB.length}`, "gain", "g", (hitTp / withB.length * 100).toFixed(1) + "% of bracketed trades") +
    scard("Hit planned stop", `${hitSl} / ${withB.length}`, "loss", "r", (hitSl / withB.length * 100).toFixed(1) + "% of bracketed trades") +
    scard("Avg favourable run", "+" + (mfeV.reduce((a, b) => a + b, 0) / mfeV.length).toFixed(2) + "%", "gain", "g", "vs avg TP at +" + tpAvg.toFixed(2) + "%") +
    scard("Avg adverse run", (maeV.reduce((a, b) => a + b, 0) / maeV.length).toFixed(2) + "%", "loss", "r", "vs avg SL at " + slAvg.toFixed(2) + "%");
};

/* ---- kelly ---- */
VIEWS.kelly = function (t, s) {
  const p = s.winrateDecided, q = 1 - p;
  const R = s.avgLoss ? Math.abs(s.avgWin / s.avgLoss) : 0;
  const kelly = R > 0 ? p - q / R : 0;
  $("#view").innerHTML = `
    <h1 class="viewtitle">Kelly Criterion</h1>
    <div class="viewdesc">How much of the bankroll your measured edge supports risking per trade — bet more and variance eats the edge, bet less and you leave growth on the table. Estimates lean on small samples, so most practitioners size at half Kelly or less.</div>
    <div class="cards" style="margin-top:0">
      ${scard("Kelly stake", (kelly * 100).toFixed(1) + "%", kelly > 0 ? "gain" : "loss", kelly > 0 ? "g" : "r")}
      ${scard("Half Kelly", (kelly * 50).toFixed(1) + "%", "", "")}
      ${scard("Winrate (p)", (p * 100).toFixed(1) + "%", "", "")}
      ${scard("Payoff ratio (R)", R.toFixed(2), "", "")}
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>Growth vs stake size</h2>
      <div class="viewdesc" style="margin-bottom:8px">Expected growth per trade at every fraction of bankroll risked, from the ${s.wins.length + s.losses.length} decided trades in view. Dashed lines mark the half-Kelly and full-Kelly stakes and the breakeven stake where growth turns negative.</div>
      <canvas id="kellyChart" height="110"></canvas>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>Rolling Kelly stake</h2>
      <div class="viewdesc" style="margin-bottom:8px">Edge stability: the all-time Kelly number can hide an edge that faded months ago. Kelly recomputed over a rolling 30-trade window.</div>
      <canvas id="rollKelly" height="80"></canvas>
    </div>`;
  if (!R || kelly <= -1) return;
  const fMax = Math.min(0.4, Math.max(0.05, kelly * 2.2 || 0.2));
  const N = 80;
  const pts = [...Array(N + 1)].map((_, i) => { const f = fMax * i / N;
    return { x: f * 100, y: f < 1 ? (p * Math.log(1 + f * R) + q * Math.log(1 - f)) * 100 : NaN }; });
  const vline = (x, color) => ({ type: "line", data: [{ x: x * 100, y: Math.min(...pts.map(p => p.y)) }, { x: x * 100, y: Math.max(...pts.map(p => p.y)) }], borderColor: color, borderDash: [4, 4], borderWidth: 1, pointRadius: 0 });
  chart("kellyChart", { type: "line", data: { datasets: [
      { data: pts, segment: { borderColor: lineColorBySign }, borderWidth: 1.8, pointRadius: 0,
        fill: { target: "origin", above: "rgba(61,220,132,.10)", below: "rgba(255,93,93,.10)" } },
      vline(kelly / 2, "#7b807c"), vline(kelly, "#7b807c"),
    ] },
    options: { ...noLegend, animation: false, parsing: false,
      plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => c.datasetIndex === 0 ? `stake ${c.parsed.x.toFixed(1)}% → growth ${c.parsed.y.toFixed(3)}%/trade` : "" } } },
      scales: { x: { type: "linear", grid: { display: false }, ticks: { callback: v => v + "%" } },
        y: { grid: { color: "#141615" }, ticks: { callback: v => v.toFixed(1) + "%" } } } } });
  const win = 30, roll = [];
  for (let i = win - 1; i < s.closed.length; i++) {
    const w = s.closed.slice(i - win + 1, i + 1);
    const ws = w.filter(x => x.pnl > 0), ls = w.filter(x => x.pnl < 0);
    const pp = (ws.length + ls.length) ? ws.length / (ws.length + ls.length) : 0;
    const aw = ws.length ? ws.reduce((a, x) => a + x.pnl, 0) / ws.length : 0;
    const al = ls.length ? Math.abs(ls.reduce((a, x) => a + x.pnl, 0) / ls.length) : 0;
    roll.push(al ? (pp - (1 - pp) / (aw / al)) * 100 : 0);
  }
  chart("rollKelly", { type: "line", data: { labels: roll.map((_, i) => i + win), datasets: [{ data: roll, segment: { borderColor: lineColorBySign }, borderWidth: 1.5, pointRadius: 0, tension: .15,
    fill: { target: "origin", above: "rgba(61,220,132,.09)", below: "rgba(255,93,93,.09)" } }] },
    options: { ...noLegend, animation: false, scales: { y: { grid: { color: "#141615" }, ticks: { callback: v => v.toFixed(0) + "%" } }, x: { display: false } } } });
};

/* ---- p&l concentration ---- */
VIEWS.conc = function (t, s) {
  $("#view").innerHTML = `
    <h1 class="viewtitle">P&amp;L Concentration</h1>
    <div class="viewdesc">How much of the total your best few trades carry — "elite traders make 80% of their annual P&amp;L on 5% of their trades", measured on your own book.</div>
    <div class="panel">
      <h2>Share of P&amp;L vs share of trades</h2>
      <div class="viewdesc" style="margin-bottom:8px">Cumulative share of net P&amp;L captured by the top slice of trades, best first. The dotted diagonal is a perfectly even split; the dashed line marks 100% — everything above it is profit the remaining trades gave back.</div>
      <canvas id="concChart" height="110"></canvas>
    </div>
    <div class="cards" id="concCards"></div>`;
  if (!s.closed.length || s.net === 0) return;
  const sorted = [...s.closed].sort((a, b) => b.pnl - a.pnl);
  let cum = 0;
  const pts = sorted.map((x, i) => { cum += x.pnl; return { x: (i + 1) / sorted.length * 100, y: cum / s.net * 100 }; });
  pts.unshift({ x: 0, y: 0 });
  const peak = Math.max(...pts.map(p => p.y));
  const n5 = Math.max(1, Math.round(sorted.length * 0.05));
  const top5Share = sorted.slice(0, n5).reduce((a, x) => a + x.pnl, 0) / s.net * 100;
  let halfN = 0, c2 = 0;
  for (const x of sorted) { c2 += x.pnl; halfN++; if (c2 >= s.net / 2) break; }
  const withoutTop5 = s.net - sorted.slice(0, n5).reduce((a, x) => a + x.pnl, 0);
  chart("concChart", { type: "line", data: { datasets: [
      { data: pts, segment: { borderColor: ctx => (ctx.p1.parsed.y >= ctx.p0.parsed.y ? css("--gain") : css("--loss")) },
        borderWidth: 1.8, pointRadius: 0, fill: { target: "origin", above: "rgba(61,220,132,.08)" } },
      { data: [{ x: 0, y: 0 }, { x: 100, y: 100 }], borderColor: "#4a4e4b", borderDash: [2, 4], borderWidth: 1, pointRadius: 0 },
      { data: [{ x: 0, y: 100 }, { x: 100, y: 100 }], borderColor: "#4a4e4b", borderDash: [6, 5], borderWidth: 1, pointRadius: 0 },
    ] },
    options: { ...noLegend, animation: false, parsing: false,
      plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => c.datasetIndex === 0 ? `top ${c.parsed.x.toFixed(1)}% of trades → ${c.parsed.y.toFixed(1)}% of P&L` : "" } } },
      scales: { x: { type: "linear", min: 0, max: 100, grid: { display: false }, ticks: { callback: v => v + "%" } },
        y: { grid: { color: "#141615" }, ticks: { callback: v => v + "%" } } } } });
  $("#concCards").innerHTML =
    scard("Top 5% of trades made", top5Share.toFixed(0) + "% of P&L", "", "g", n5 + " trade" + (n5 > 1 ? "s" : "")) +
    scard("Half the P&L came from", halfN + " trade" + (halfN > 1 ? "s" : ""), "", "g") +
    scard("Winners peaked at", peak.toFixed(0) + "%", "gain", "g", "of final net P&L") +
    scard("Without the top 5%", smoney(withoutTop5), cls(withoutTop5), withoutTop5 >= 0 ? "g" : "r");
};

/* ---- p&l distribution (ranked) ---- */

/* ---- performance by time ---- */
VIEWS.bytime = function (t, s) {
  const periods = { weekday: { labels: DOW, key: d => (d.getDay() + 6) % 7 }, hour: { labels: [...Array(24).keys()].map(h => String(h).padStart(2, "0")), key: d => d.getHours() }, month: { labels: MONTHS, key: d => d.getMonth() } };
  const P = periods[btPeriod];
  const dateOf = x => new Date(btDate === "entry" ? x.entry_date : x.exit_date);
  const groups = P.labels.map(l => ({ label: l, n: 0, wins: 0, losses: 0, total: 0 }));
  for (const x of s.closed) { const g = groups[P.key(dateOf(x))]; g.n++; g.total += x.pnl; if (x.pnl > 0) g.wins++; else if (x.pnl < 0) g.losses++; }
  const withTrades = groups.filter(g => g.n);
  const best = withTrades.length ? withTrades.reduce((a, b) => b.total > a.total ? b : a) : null;

  $("#view").innerHTML = `
    <h1 class="viewtitle">Performance by Time</h1>
    <div class="viewdesc">Where in the calendar your edge sits — ${s.closed.length} trades bucketed by ${btPeriod[0].toUpperCase() + btPeriod.slice(1)}, on ${btDate === "entry" ? "Entry" : "Close"} Date.</div>
    <div class="panel">
      <div class="display-row" style="margin-bottom:8px">
        <div><div class="lbl">Display</div><select class="ctl" style="width:auto" disabled><option>Total Return ($)</option></select></div>
        <div><div class="lbl">Date settings</div><select id="btDateSel" class="ctl" style="width:auto"><option value="entry" ${btDate === "entry" ? "selected" : ""}>Entry Date</option><option value="close" ${btDate === "close" ? "selected" : ""}>Close Date</option></select></div>
        <div><div class="lbl">Period</div><select id="btPeriodSel" class="ctl" style="width:auto"><option value="weekday" ${btPeriod === "weekday" ? "selected" : ""}>Weekday</option><option value="hour" ${btPeriod === "hour" ? "selected" : ""}>Hour</option><option value="month" ${btPeriod === "month" ? "selected" : ""}>Month</option></select></div>

    </div>
    <div class="dash-grid" style="margin-top:14px">
      <div class="panel"><div style="max-height:320px;overflow:auto"><table><thead><tr><th>${btPeriod}</th><th class="num">Trades</th><th class="num">Winrate (%)</th><th class="num">Avg. Return ($)</th><th class="num">Total Gain ($)</th></tr></thead><tbody>
        ${withTrades.map(g => `<tr><td>${g.label}</td><td class="num">${g.n}</td><td class="num">${(g.wins / Math.max(1, g.wins + g.losses) * 100).toFixed(2)}</td>
          <td class="num ${cls(g.total / g.n)}">${(g.total / g.n).toFixed(2)}</td><td class="num ${cls(g.total)}">${g.total.toFixed(2)}</td></tr>`).join("")}
      </tbody></table></div></div>
      <div class="grid">
        ${best ? scard("Best " + btPeriod, smoney(best.total), "gain", "g", best.label) : ""}
        ${worst ? scard("Worst " + btPeriod, smoney(worst.total), "loss", "r", worst.label) : ""}
        ${scard("Trades per " + btPeriod, withTrades.length ? (s.closed.length / withTrades.length).toFixed(2) : "—", "", "")}
        ${scard("Average " + btPeriod, withTrades.length ? smoney(s.net / withTrades.length) : "—", cls(s.net), s.net >= 0 ? "g" : "r")}
      </div>
    </div>`;
  $("#btDateSel").addEventListener("change", e => { btDate = e.target.value; render(); });
  $("#btPeriodSel").addEventListener("change", e => { btPeriod = e.target.value; render(); });
  chart("btChart", { type: "bar", data: { labels: P.labels, datasets: [{ data: groups.map(g => g.total), backgroundColor: groups.map(g => g.total >= 0 ? css("--gain") : css("--loss")), borderRadius: 3 }] },
    options: { ...noLegend, animation: false, plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => smoney(c.parsed.y) } } },
      scales: { y: { grid: { color: "#141615" }, ticks: kTicks, title: { display: true, text: "Total Return ($)" } }, x: { grid: { display: false } } } } });

/* ---- performance ratio ---- */
VIEWS.perfratio = function (t, s) {
  const decided = s.closed.filter(x => x.pnl !== 0);
  const setups = [...new Set(decided.map(x => x.setup || "No setup"))].sort();
  const seriesFor = list => { let w = 0, n = 0; return list.map(x => { n++; if (x.pnl > 0) w++; return { i: n, y: w / n * 100 }; }); };
  const overall = seriesFor(decided);
  const bySetup = setups.map((name, i) => ({ name, color: PALETTE[(i + 1) % PALETTE.length], data: seriesFor(decided.filter(x => (x.setup || "No setup") === name)), list: decided.filter(x => (x.setup || "No setup") === name) }));
  const rating = wr => wr >= 65 ? "Excellent" : wr >= 55 ? "Good" : wr >= 40 ? "Average" : "Poor";
  const summary = wr => wr >= 65 ? "A real statistical edge — protect it with consistent sizing." :
    wr >= 55 ? "Better than a coin flip — the edge compounds if losses stay contained." :
    wr >= 40 ? "Roughly a coin flip — the edge has to come from trade management." :
    "Losing more often than winning — only viable with big winners.";
  $("#view").innerHTML = `
    <h1 class="viewtitle">Performance Ratio</h1>
    <div class="viewdesc">Winrate (%) recomputed after every trade, split by setups. Winning trades as a share of decided trades; break-evens are excluded from both sides.</div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px">
        <div class="display-row" style="margin:0">
          <div><div class="lbl">Ratio</div><select class="ctl" style="width:auto" disabled><option>Winrate (%)</option></select></div>
          <div><div class="lbl">Split by</div><select class="ctl" style="width:auto" disabled><option>Setups</option></select></div>
        </div>
        <div class="legend" style="align-self:flex-end"><span style="color:${PALETTE[0]}">●</span> Overall ${bySetup.map(x => `<span style="color:${x.color}">●</span> ${esc(x.name)}`).join(" ")}</div>
      </div>
      <canvas id="prChart" height="120"></canvas>
    </div>
    <div class="panel" style="margin-top:14px">
      <table><thead><tr><th>Split</th><th class="num">Winrate (%)</th><th>Rating</th><th>Summary</th></tr></thead><tbody>
        <tr><td><span style="color:${PALETTE[0]}">●</span> Overall <span class="muted">${decided.length}</span></td>
          <td class="num">${overall.length ? overall[overall.length - 1].y.toFixed(2) : "—"}</td>
          <td>${overall.length ? rating(overall[overall.length - 1].y) : ""}</td><td class="muted">${overall.length ? summary(overall[overall.length - 1].y) : ""}</td></tr>
        ${bySetup.map(x => { const wr = x.data.length ? x.data[x.data.length - 1].y : 0;
          return `<tr><td><span style="color:${x.color}">●</span> ${esc(x.name)} <span class="muted">${x.list.length}</span></td>
          <td class="num">${wr.toFixed(2)}</td><td>${rating(wr)}</td><td class="muted">${summary(wr)}</td></tr>`; }).join("")}
      </tbody></table>
    </div>`;
  chart("prChart", { type: "line", data: { datasets: [
      { data: overall.map(p => ({ x: p.i, y: p.y })), borderColor: PALETTE[0], borderWidth: 1.8, pointRadius: 0, stepped: false, tension: .1 },
      ...bySetup.map(x => ({ data: x.data.map(p => ({ x: p.i, y: p.y })), borderColor: x.color, borderWidth: 1.2, pointRadius: 0, stepped: true })),
    ] },
    options: { ...noLegend, animation: false, parsing: false, interaction: { intersect: false, mode: "nearest" },
      plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => (c.datasetIndex === 0 ? "Overall" : bySetup[c.datasetIndex - 1].name) + ": " + c.parsed.y.toFixed(1) + "%" } } },
      scales: { x: { type: "linear", grid: { display: false }, title: { display: true, text: "Trades" } },
        y: { min: 0, max: 100, grid: { color: "#141615" }, title: { display: true, text: "Winrate (%)" } } } } });
};

/* ---- risk distribution (histogram) ---- */
VIEWS.riskdist = function (t, s) {
  $("#view").innerHTML = `
    <h1 class="viewtitle">Risk Distribution</h1>
    <div class="viewdesc">How your outcomes are spread — where the mass of trades sits, and how far the losing tail runs.</div>
    <div class="panel">
      <div class="display-row" style="margin-bottom:8px">${unitSel("rdUnit")}</div>
      <canvas id="rdChart" height="120"></canvas>
    </div>
    ${unitCards(s)}`;
  bindUnit("rdUnit");
  const vals = s.closed.map(unitVal);
  if (!vals.length) return;
  const min = Math.min(...vals), max = Math.max(...vals);
  const bins = Math.min(40, Math.max(10, Math.ceil(Math.sqrt(vals.length) * 3)));
  const w = (max - min) / bins || 1;
  const counts = Array(bins).fill(0), centers = [];
  for (const v of vals) counts[Math.min(bins - 1, Math.floor((v - min) / w))]++;
  for (let i = 0; i < bins; i++) centers.push(min + w * (i + .5));
  const lbl = v => eqUnit === "$" ? kfmt(v) : v.toFixed(1) + (eqUnit === "%" ? "%" : "R");
  chart("rdChart", { type: "bar",
    data: { labels: centers.map((c, i) => `${lbl(min + w * i)} to ${lbl(min + w * (i + 1))}`), datasets: [{ data: counts, backgroundColor: centers.map(c => c >= 0 ? css("--gain") : css("--loss")), borderRadius: 2 }] },
    options: { ...noLegend, animation: false,
      plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => c.parsed.y + " trades" } } },
      scales: { y: { grid: { color: "#141615" }, title: { display: true, text: "Number of Trades" } },
        x: { grid: { display: false }, ticks: { maxTicksLimit: 16, maxRotation: 60, minRotation: 40 }, title: { display: true, text: `Return (${eqUnit})` } } } } });
};

/* ---- rolling expectancy ---- */
VIEWS.rolling = function (t, s) {
  const win = rollWin;
  const roll = [];
  for (let i = win - 1; i < s.closed.length; i++) {
    const w = s.closed.slice(i - win + 1, i + 1);
    roll.push({ i: i + 1, y: w.reduce((a, b) => a + b.pnl, 0) / w.length });
  }
  const last = s.closed.slice(-win);
  const lw = last.filter(x => x.pnl > 0), ll = last.filter(x => x.pnl < 0);
  const lwSum = lw.reduce((a, x) => a + x.pnl, 0), llSum = Math.abs(ll.reduce((a, x) => a + x.pnl, 0));
  $("#view").innerHTML = `
    <h1 class="viewtitle">Rolling Expectancy</h1>
    <div class="viewdesc">Your edge over the last ${win} trades at every point in time — a flat all-time number can hide an edge that stopped working months ago.</div>
    <div class="panel">
      <div class="display-row" style="margin-bottom:8px">
        <div><div class="lbl">Display</div><select class="ctl" style="width:auto" disabled><option>Expectancy ($/trade)</option></select></div>
        <div><div class="lbl">Window</div><select id="rwSel" class="ctl" style="width:auto">${[10,20,50].map(w => `<option ${w === win ? "selected" : ""}>${w}</option>`).join("")}</select></div>
      </div>
      ${last.length ? `<div class="muted" style="font-size:11px;margin-bottom:8px">Latest ${Math.min(win, s.closed.length)}-trade window: ${smoney(last.reduce((a, x) => a + x.pnl, 0) / last.length)} / trade · ${(lw.length / Math.max(1, lw.length + ll.length) * 100).toFixed(1)}% winrate · ${llSum ? (lwSum / llSum).toFixed(2) : "∞"} profit factor</div>` : ""}
      <canvas id="rollExp" height="110"></canvas>
    </div>`;
  $("#rwSel").addEventListener("change", e => { rollWin = +e.target.value; render(); });
  chart("rollExp", { type: "line", data: { datasets: [{ data: roll.map(p => ({ x: p.i, y: p.y })), segment: { borderColor: lineColorBySign }, borderWidth: 1.6, pointRadius: 0, tension: .15,
    fill: { target: "origin", above: "rgba(61,220,132,.09)", below: "rgba(255,93,93,.09)" } }] },
    options: { ...noLegend, animation: false, parsing: false,
      plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => smoney(c.parsed.y) + " / trade" } } },
      scales: { y: { grid: { color: "#141615" }, ticks: kTicks }, x: { type: "linear", grid: { display: false }, title: { display: true, text: "Trades" } } } } });
};

/* ---- stop distance vs winrate ---- */
VIEWS.stopdist = function (t, s) {
  const withStop = s.closed.filter(x => x.stop_loss != null && x.pnl !== 0);
  const edges = stopEdges.split(",").map(x => parseFloat(x)).filter(x => !isNaN(x) && x > 0).sort((a, b) => a - b);
  const labels = ["< " + edges[0] + "%", ...edges.slice(0, -1).map((e, i) => e + "-" + edges[i + 1] + "%"), edges[edges.length - 1] + "%+"];
  const buckets = labels.map(() => ({ n: 0, w: 0 }));
  for (const x of withStop) {
    const d = Math.abs(Number(x.entry_price) - Number(x.stop_loss)) / Number(x.entry_price) * 100;
    let bi = edges.findIndex(e => d < e); if (bi === -1) bi = edges.length;
    buckets[bi].n++; if (x.pnl > 0) buckets[bi].w++;
  }
  $("#view").innerHTML = `
    <h1 class="viewtitle">Stop Distance vs Winrate</h1>
    <div class="viewdesc">How often trades win depending on how far the stop sat from entry — the price of a tight stop, measured on your own trades. ${s.closed.length - withStop.length} trades omitted: no stop loss journalled.</div>
    <div class="count-line">${withStop.length} of ${s.closed.length} trades in view carry a journalled stop</div>
    <div class="display-row">
      <div><div class="lbl">Bucket edges (% from entry)</div><input id="edgeIn" value="${esc(stopEdges)}" style="width:220px"></div>
      <div style="align-self:flex-end" class="muted">Buckets: ${labels[0]} … ${labels[labels.length - 1]}</div>
    </div>
    <div class="panel">
      <div class="display-row" style="margin-bottom:8px"><div><div class="lbl">Display</div><select class="ctl" style="width:auto" disabled><option>Winrate (%)</option></select></div></div>
      <canvas id="sdChart" height="120"></canvas>
    </div>`;
  $("#edgeIn").addEventListener("change", e => { stopEdges = e.target.value; render(); });
  if (!withStop.length) return;
  chart("sdChart", { type: "bar",
    data: { labels: labels.map((l, i) => [l, buckets[i].n + " trades"]), datasets: [{ data: buckets.map(b => b.n ? b.w / b.n * 100 : 0), backgroundColor: css("--gain"), borderRadius: 3 }] },
    options: { ...noLegend, animation: false,
      plugins: { ...noLegend.plugins, tooltip: { callbacks: { label: c => c.parsed.y.toFixed(1) + "% winrate · " + buckets[c.dataIndex].n + " trades" } } },
      scales: { y: { min: 0, max: 100, grid: { color: "#141615" }, ticks: { callback: v => v + "%" } },
        x: { grid: { display: false }, title: { display: true, text: "Stop distance from entry (% of entry price)" } } } } });
};

/* ---- trade efficiency ---- */
VIEWS.efficiency = function (t, s) {
  const withMM = s.closed.filter(x => x.max_price != null && x.min_price != null && Number(x.max_price) > Number(x.min_price));
  let body;
  if (!withMM.length) {
    body = `<div class="viewdesc">No trade in this range has a max and min price recorded. Open one on the Trades page and add them to chart it.</div>`;
  } else {
    body = `<div class="panel">
      <div class="legend" style="margin-bottom:8px"><span><span class="gain">●</span> Total efficiency (captured share of the full move)</span></div>
      <canvas id="effChart" height="120"></canvas></div>
      <div class="cards" id="effCards"></div>`;
  }
  $("#view").innerHTML = `
    <h1 class="viewtitle">Trade Efficiency</h1>
    <div class="viewdesc">How much of each trade's available move you actually captured, split into what the entry contributed and what the exit did. ${withMM.length} of ${s.closed.length} trades have the max and min price needed to chart — no take profit or stop loss required.</div>
    ${body}`;
  if (!withMM.length) return;
  const eff = withMM.map(x => {
    const hi = Number(x.max_price), lo = Number(x.min_price), e = Number(x.entry_price), xx = Number(x.exit_price), rng = hi - lo;
    const long = x.direction === "long";
    return { t: x,
      entryEff: (long ? (hi - e) : (e - lo)) / rng * 100,
      exitEff: (long ? (xx - lo) : (hi - xx)) / rng * 100,
      total: (long ? (xx - e) : (e - xx)) / rng * 100 };
  });
  const avg = k => eff.reduce((a, x) => a + x[k], 0) / eff.length;
  chart("effChart", { type: "bar",
    data: { labels: eff.map((_, i) => i + 1), datasets: [{ data: eff.map(x => x.total), backgroundColor: eff.map(x => x.total >= 0 ? css("--gain") : css("--loss")), borderRadius: 2 }] },
    options: { ...noLegend, animation: false,
      plugins: { ...noLegend.plugins, tooltip: { callbacks: {
        title: i => { const x = eff[i[0].dataIndex].t; return `${x.symbol} · ${dt(x.exit_date)}`; },
        label: c => { const x = eff[c.dataIndex]; return [`captured ${x.total.toFixed(1)}% of the move`, `entry eff ${x.entryEff.toFixed(1)}% · exit eff ${x.exitEff.toFixed(1)}%`]; } } } },
      scales: { y: { grid: { color: "#141615" }, ticks: { callback: v => v + "%" }, title: { display: true, text: "% of available move" } },
        x: { grid: { display: false }, ticks: { maxTicksLimit: 14 }, title: { display: true, text: "Trades" } } } } });
  $("#effCards").innerHTML =
    scard("Avg total efficiency", avg("total").toFixed(1) + "%", cls(avg("total")), avg("total") >= 0 ? "g" : "r", "share of high-to-low range captured") +
    scard("Avg entry efficiency", avg("entryEff").toFixed(1) + "%", "", "", "how much room the entry left to run") +
    scard("Avg exit efficiency", avg("exitEff").toFixed(1) + "%", "", "", "how close the exit got to the extreme");
};

/* ---- EV calculator ---- */
VIEWS.ev = function (t, s) {
  if (!evIn) evIn = { p: +(s.winrateDecided * 100).toFixed(0) || 50, W: Math.round(s.avgWin) || 150, L: Math.round(Math.abs(s.avgLoss)) || 100, cost: 0, N: 100 };
  const { p, W, L, cost, N } = evIn;
  const pp = p / 100, q = 1 - pp;
  const ev = pp * W - q * L - cost;
  const pf = q * L ? (pp * W) / (q * L) : null;
  const variance = pp * (W - cost - ev) ** 2 + q * (-L - cost - ev) ** 2;
  const sd = Math.sqrt(variance);
  const beWr = (L + cost) / (W + L) * 100;
  const pNeg = sd ? normCdf(-ev * Math.sqrt(N) / sd) * 100 : (ev < 0 ? 100 : 0);
  $("#view").innerHTML = `
    <h1 class="viewtitle">EV Calculator</h1>
    <div class="viewdesc">What a win rate and a payoff are worth per trade — and what variance does to that edge over a run of trades. Enter sizes in dollars, or in R-multiples if you think in risk units; the maths is the same.</div>
    <div class="panel">
      <div class="display-row" style="margin:0">
        ${[["Win rate %","p"],["Average winner $","W"],["Average loser $","L"],["Cost per trade $","cost"],["Trades #","N"]].map(([l, k]) =>
          `<div><div class="lbl">${l}</div><input type="number" step="any" class="ctl" style="width:150px;text-align:right" data-ev="${k}" value="${evIn[k]}"></div>`).join("")}
        <div style="align-self:flex-end"><button class="btn ghost" id="evFromStats">Use my stats</button></div>
      </div>
    </div>
    <div class="cards">
      ${scard("Expected value per trade", money(ev), cls(ev), ev >= 0 ? "g" : "r", pf != null ? "Profit factor " + pf.toFixed(2) : "")}
      ${scard("Expected after " + N + " trades", money(ev * N), cls(ev), ev >= 0 ? "g" : "r", "±1σ " + money(sd * Math.sqrt(N)))}
      ${scard("Breakeven win rate", beWr.toFixed(1) + "%", "", "", p > beWr ? "You are above it — the edge is real" : "You are below it — negative expectancy")}
      ${scard("Still down after " + N, pNeg.toFixed(1) + "%", pNeg > 20 ? "loss" : "", pNeg > 20 ? "r" : "g", "Odds variance leaves you negative")}
    </div>
    <div class="panel" style="margin-top:14px">
      <h2><span>Expected equity over ${N} trades</span><span class="legend"><span style="color:#4b9eff">—</span> Expected equity <span>▒ ±1σ variance</span></span></h2>
      <canvas id="evChart" height="110"></canvas>
    </div>`;
  document.querySelectorAll("[data-ev]").forEach(el => el.addEventListener("change", e => { evIn[e.target.dataset.ev] = +e.target.value || 0; render(); }));
  $("#evFromStats").addEventListener("click", () => { evIn = null; render(); });
  const xs = [...Array(N + 1).keys()];
  chart("evChart", { type: "line", data: { labels: xs, datasets: [
      { data: xs.map(i => ev * i + sd * Math.sqrt(i)), borderWidth: 0, pointRadius: 0, fill: "+1", backgroundColor: "rgba(160,170,160,.10)" },
      { data: xs.map(i => ev * i - sd * Math.sqrt(i)), borderWidth: 0, pointRadius: 0, fill: false },
      { data: xs.map(i => ev * i), borderColor: "#4b9eff", borderWidth: 1.7, pointRadius: 0 },
    ] },
    options: { ...noLegend, animation: false,
      plugins: { ...noLegend.plugins, tooltip: { filter: c => c.datasetIndex === 2, callbacks: { label: c => "Expected: " + money(c.parsed.y) } } },
      scales: { y: { grid: { color: "#141615" }, ticks: kTicks }, x: { grid: { display: false }, ticks: { maxTicksLimit: 10 }, title: { display: true, text: "Trade #" } } } } });
};

/* ---- simulator ---- */
VIEWS.sim = function (t, s) {
  if (!simIn) simIn = { sims: 20, n: 500, useKpi: false, p: 50, gain: 500, loss: -250, bal: 20000 };
  if (simIn.useKpi) { simIn.p = +(s.winrateDecided * 100).toFixed(1) || 50; simIn.gain = Math.round(s.avgWin) || 500; simIn.loss = Math.round(s.avgLoss) || -250; }
  const avgR = simIn.loss ? Math.abs(simIn.gain / simIn.loss) : 0;
  $("#view").innerHTML = `
    <h1 class="viewtitle">Simulator</h1>
    <div class="viewdesc">Monte Carlo runs of your edge: each simulation replays the same winrate and average win/loss as a fresh sequence of trades.</div>
    <div style="display:grid;grid-template-columns:340px 1fr;gap:14px" class="sim-wrap">
      <div class="panel edit-panel">
        <h2>Edit Data</h2>
        <div class="field"><div class="lbl">Number of Simulations</div><input type="number" data-sim="sims" value="${simIn.sims}" min="1" max="200"></div>
        <div class="field"><div class="lbl">Number of Trades</div><input type="number" data-sim="n" value="${simIn.n}" min="10" max="5000"></div>
        <div class="field" style="display:flex;justify-content:space-between;align-items:center"><div class="lbl" style="margin:0">Use KPI From my Trades</div>
          <div class="switch ${simIn.useKpi ? "on" : ""}" id="kpiSwitch"><i></i></div></div>
        <div class="field"><div class="lbl">Winrate (%)</div><input type="number" step="any" data-sim="p" value="${simIn.p}" ${simIn.useKpi ? "disabled" : ""}></div>
        <div class="field"><div class="lbl">Avg. Gain ($)</div><input type="number" step="any" data-sim="gain" value="${simIn.gain}" ${simIn.useKpi ? "disabled" : ""}></div>
        <div class="field"><div class="lbl">Avg. Loss ($)</div><input type="number" step="any" data-sim="loss" value="${simIn.loss}" ${simIn.useKpi ? "disabled" : ""}></div>
        <div class="field"><div class="lbl">Start Balance ($)</div><input type="number" step="any" data-sim="bal" value="${simIn.bal}"></div>
        <div class="field" style="display:flex;justify-content:space-between"><span class="muted">Avg. R - Multiple</span><span>${avgR.toFixed(2)}</span></div>
        <button class="btn" id="simRun" style="width:100%">Start Simulation</button>
      </div>
      <div class="panel" style="border-style:${simRuns ? "solid" : "dashed"};display:flex;flex-direction:column">
        ${simRuns ? '<canvas id="simChart" height="130"></canvas><div class="muted" id="simSummary" style="font-size:11px;margin-top:8px"></div>' :
          '<div class="empty" style="margin:auto">Set the parameters and hit Start Simulation — every run draws a fresh set of equity curves.</div>'}
      </div>
    </div>`;
  document.querySelectorAll("[data-sim]").forEach(el => el.addEventListener("change", e => { simIn[e.target.dataset.sim] = +e.target.value || 0; simRuns = null; render(); }));
  $("#kpiSwitch").addEventListener("click", () => { simIn.useKpi = !simIn.useKpi; simRuns = null; render(); });
  $("#simRun").addEventListener("click", () => {
    const sims = Math.min(200, Math.max(1, simIn.sims)), n = Math.min(5000, Math.max(10, simIn.n));
    simRuns = [];
    for (let k = 0; k < sims; k++) {
      let bal = simIn.bal; const path = [bal];
      for (let i = 0; i < n; i++) { bal += Math.random() * 100 < simIn.p ? simIn.gain : simIn.loss; path.push(bal); }
      simRuns.push(path);
    }
    render();
  });
  if (simRuns) {
    const n = simRuns[0].length - 1;
    const step = Math.max(1, Math.floor(n / 400));
    const xs = []; for (let i = 0; i <= n; i += step) xs.push(i);
    const finals = simRuns.map(p => p[p.length - 1]).sort((a, b) => a - b);
    const median = finals[Math.floor(finals.length / 2)];
    const busted = simRuns.filter(p => p.some(v => v <= 0)).length;
    chart("simChart", { type: "line", data: { labels: xs, datasets: simRuns.map((p, i) => ({
        data: xs.map(x => p[x]), borderColor: `hsla(${140 + (i * 47) % 160}, 60%, 55%, .45)`, borderWidth: 1, pointRadius: 0 })) },
      options: { ...noLegend, animation: false, interaction: { intersect: false },
        plugins: { ...noLegend.plugins, tooltip: { enabled: false } },
        scales: { y: { grid: { color: "#141615" }, ticks: kTicks }, x: { grid: { display: false }, ticks: { maxTicksLimit: 10 }, title: { display: true, text: "Trade #" } } } } });
    $("#simSummary").innerHTML = `${simRuns.length} runs · median final ${money(median)} · best ${money(finals[finals.length - 1])} · worst ${money(finals[0])}${busted ? ` · <span class="loss">${busted} run${busted > 1 ? "s" : ""} hit $0</span>` : ""}`;
  }
};

async function renderBookDetail() {

  } catch (e) { $("#bookImgZone").innerHTML = `<div class="book-empty">${esc(e.message)}</div>`; }
  $("#imgIn").addEventListener("change", async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const dataUrl = await shrinkImage(file);
      await api(`/api/trades/${meta.id}`, { method: "PATCH", body: JSON.stringify({ chart_image: dataUrl }) });
      meta.has_image = true; toast("Screenshot attached"); renderBookDetail();
    } catch (err) { toast(err.message); }
  });
  $("#imgRm").addEventListener("click", async () => {
    try { await api(`/api/trades/${meta.id}`, { method: "PATCH", body: JSON.stringify({ chart_image: null }) }); meta.has_image = false; toast("Screenshot removed"); renderBookDetail(); }
    catch (err) { toast(err.message); }
  });
}
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1500, scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const out = c.toDataURL("image/jpeg", 0.85);
      if (out.length > 6e6) return reject(new Error("Image too large even after compression"));
      resolve(out);
    };
    img.onerror = () => reject(new Error("Could not read image"));
    img.src = URL.createObjectURL(file);
  });
}

}
function renderAccounts() {
  const accounts = [...new Set(all.map(x => x.account))].sort();
  const cur = $("#fAccount").value;
  $("#acctList").innerHTML = accounts.map(a =>
    `<button class="nav-item acct-item ${cur === a ? "active" : ""}" data-acct="${esc(a)}">${esc(a)}</button>`).join("") || '<div class="muted" style="padding:4px 10px;font-size:11px">No accounts yet</div>';
  document.querySelectorAll("[data-acct]").forEach(b => b.addEventListener("click", () => {
    $("#fAccount").value = $("#fAccount").value === b.dataset.acct ? "" : b.dataset.acct;
    renderAccounts(); render();
  }));
}
async function load() {
  try { all = await api("/api/trades"); fillFilterOptions(); renderAccounts(); render(); }
  catch (e) { toast(e.message); $("#view").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
load();
</script>
</body>
</html>
